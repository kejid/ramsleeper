<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAM Sleeper</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a65; --line: #e4e2da;
    --accent: #c8643c; --accent-soft: rgba(200,100,60,.12); --ok: #2f7d4f; --warn: #a86b00; --danger: #b3261e;
    --bar: #d9d6cc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1918; --panel: #232221; --text: #f1efe9; --muted: #a9a69e; --line: #3a3936;
      --accent: #e58a63; --accent-soft: rgba(229,138,99,.16); --ok: #6cc08d; --warn: #e0a84a; --danger: #f08a80; --bar: #3f3d3a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .cwd { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .you { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 99px; font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
  .ram { min-width: 150px; }
  .bar { height: 6px; background: var(--bar); border-radius: 3px; margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .pill.idle { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .pill.busy { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--danger); border-color: var(--danger); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty, .error { padding: 28px; text-align: center; color: var(--muted); }
  .error { color: var(--danger); }
  .foot { margin-top: 12px; color: var(--muted); font-size: 12px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 22px; width: min(620px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 6px; font-size: 18px; }
  dialog ul { max-height: 240px; overflow: auto; padding-left: 18px; margin: 8px 0; font-size: 13px; }
  dialog li { margin: 2px 0; overflow-wrap: anywhere; }
  .flag { color: var(--warn); font-weight: 600; }
  .note { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 12px 0; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; }
  .tabs { display: flex; gap: 4px; }
  .tabs a { padding: 4px 12px; border-radius: 99px; color: var(--muted); text-decoration: none; font-size: 14px; }
  .tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .h2 { font-size: 17px; margin: 26px 0 10px; }
  .step { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .step:last-child { border-bottom: 0; }
  .mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--bar); color: var(--muted); }
  .mark.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .mark.todo { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .step b { display: block; margin-bottom: 2px; }
  .step p { margin: 2px 0; color: var(--muted); font-size: 14px; }
  .step .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  code, .cmd { font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
  .cmd { display: flex; gap: 8px; align-items: center; margin-top: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .cmd span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .cmd button { padding: 3px 10px; font-size: 13px; }
  ul.cmds { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
  ul.cmds li { margin: 3px 0; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .seg button { padding: 4px 12px; font-size: 13px; }
  .seg button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .bands { display: flex; height: 26px; border-radius: 8px; overflow: hidden; margin: 10px 0 6px; font-size: 12px; font-weight: 600; }
  .bands span { display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; color: #fff; }
  .b-ok { background: #2ea043; } .b-warn { background: #d28c14; } .b-high { background: #c8322d; }
  .lvl-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 14px; }
  .lvl-row > span:first-child { min-width: 90px; color: var(--muted); }
  .lvl-row .seg { margin-top: 0; }
  .lvl-row .gb { color: var(--muted); font-size: 13px; }
  .faq details { border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .faq details:last-child { border-bottom: 0; }
  .faq summary { cursor: pointer; font-weight: 600; }
  .faq summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .faq p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 720px) {
    .step { grid-template-columns: 28px minmax(0, 1fr); }
    .step .btns { grid-column: 2; justify-content: flex-start; }
    .hide-sm { display: none; }
    th, td { padding: 8px; }
    .ram { min-width: 90px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>RAM Sleeper</h1>
    <nav class="tabs" aria-label="Views">
      <a href="#sessions" id="tab-sessions" data-i18n="tabSessions"></a>
      <a href="#setup" id="tab-setup" data-i18n="tabSetup"></a>
    </nav>
    <span class="sub" id="updated"></span>
  </header>
  <div id="view-sessions">
    <section class="stats" id="stats"></section>
    <section class="card" id="list"><div class="empty" data-i18n="loading"></div></section>
    <p class="foot" id="metric"></p>
  </div>
  <div id="view-setup" hidden>
    <section class="card steps" id="steps"><div class="empty" data-i18n="loading"></div></section>
    <h2 class="h2" data-i18n="faqTitle"></h2>
    <section class="card faq" id="faq"></section>
  </div>
</main>

<dialog id="confirm">
  <h2 id="c-title"></h2>
  <div id="c-body"></div>
  <div class="actions">
    <button id="c-cancel" data-i18n="cancel"></button>
    <button id="c-ok" class="primary" data-i18n="unload"></button>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script>
const TOKEN = '__TOKEN__';
const RU = (navigator.language || '').toLowerCase().startsWith('ru');
const T = RU ? {
  loading: 'Загрузка…', cancel: 'Отмена', unload: 'Выгрузить', session: 'Сессия', ram: 'Память', procs: 'Процессы',
  status: 'Статус', last: 'Активность', idle: 'ждёт', busy: 'работает', you: 'эта сессия',
  sessions: 'сессий Claude Code', app: 'само приложение Claude', total: 'в сессиях', none: 'Запущенных сессий Claude Code нет.',
  updated: s => `обновлено ${s}`, just: 'только что', min: n => `${n} мин назад`, hr: n => `${n} ч назад`, day: n => `${n} дн назад`,
  whyCurrent: 'Это сессия, из которой открыта панель', whyBusy: 'Сессия сейчас работает — дождитесь окончания хода',
  confirmTitle: t => `Выгрузить «${t}»?`,
  frees: (m, n) => `Освободится около <b>${m}</b>: остановятся ${n} процессов.`,
  flagged: 'Остановится и это (не MCP-сервер):',
  keep: 'Переписка сохранена в транскрипте. Процессы можно запустить снова.',
  resumeDesktop: 'Чтобы вернуть: откройте сессию в приложении Claude и напишите сообщение — она снова загрузится в память с той же перепиской.',
  resumeCli: c => `Чтобы продолжить: <code>${c}</code>`,
  done: (t, m) => `«${t}» выгружена, освобождено ~${m}.`, failed: e => `Не удалось: ${e}`,
  metric: m => `Память: ${m === 'RSS' ? 'RSS (разделяемые страницы считаются несколько раз)' : 'частный рабочий набор, как колонка «Память» в Диспетчере задач'}. Панель работает только на этом компьютере и ничего не отправляет в сеть.`,
  gone: 'Панель остановлена. Запустите её снова командой /ramsleeper:dashboard.',
} : {
  loading: 'Loading…', cancel: 'Cancel', unload: 'Unload', session: 'Session', ram: 'Memory', procs: 'Processes',
  status: 'Status', last: 'Last activity', idle: 'idle', busy: 'busy', you: 'this session',
  sessions: 'Claude Code sessions', app: 'Claude app itself', total: 'in sessions', none: 'No running Claude Code sessions.',
  updated: s => `updated ${s}`, just: 'just now', min: n => `${n} min ago`, hr: n => `${n} h ago`, day: n => `${n} d ago`,
  whyCurrent: 'This is the session the dashboard was opened from', whyBusy: 'The session is working; wait until the turn ends',
  confirmTitle: t => `Unload "${t}"?`,
  frees: (m, n) => `Frees about <b>${m}</b> by stopping ${n} processes.`,
  flagged: 'This stops too (not an MCP server):',
  keep: 'The conversation stays in its transcript. Nothing is deleted.',
  resumeDesktop: 'To bring it back: open the session in the Claude app and send a message. It loads back into memory with the same conversation.',
  resumeCli: c => `To continue: <code>${c}</code>`,
  done: (t, m) => `Unloaded "${t}", ~${m} freed.`, failed: e => `Failed: ${e}`,
  metric: m => `Memory: ${m === 'RSS' ? 'RSS (shared pages are counted more than once)' : 'private working set, the same as the Memory column in Task Manager'}. The dashboard runs on this computer only and sends nothing over the network.`,
  gone: 'The dashboard has stopped. Start it again with /ramsleeper:dashboard.',
};
Object.assign(T, RU ? {
  tabSessions: 'Сессии', tabSetup: 'Настройка', faqTitle: 'Частые вопросы',
  interruptBtn: 'Прервать и выгрузить', busyWarn: 'Сессия сейчас работает: текущий ход оборвётся. Переписка до него сохранится.',
  nodeTitle: 'Node.js', nodeOk: v => `Установлен ${v}.`, nodeOld: v => `Установлен ${v}, нужен 18 или новее.`,
  cmdTitle: 'Команды в Claude Code',
  cmdHint: 'Или просто спросите Claude: «какая сессия ест больше всего памяти?», «выгрузи те, что простаивают с утра».',
  cmds: [['/ramsleeper:sessions', 'список сессий с памятью'], ['/ramsleeper:sessions unload 3', 'выгрузить сессию из строки 3, с подтверждением'],
    ['/ramsleeper:dashboard', 'эта панель'], ['/ramsleeper:tray', 'значок в трее или строке меню'], ['/ramsleeper:setup', 'эта страница настройки']],
  trayTitle: 'Значок в трее Windows', trayOn: 'Запущен. Цифра — сколько сессий ждут вашего сообщения (порог ниже), цвет — сколько памяти занимают все сессии.',
  trayOff: 'Не запущен. Клик по значку открывает список сессий с кнопками выгрузки.', trayStart: 'Запустить',
  autoTitle: 'Запуск при входе в Windows', autoOn: 'Включён: значок появится сам после перезагрузки.', autoOff: 'Выключен.',
  autoEnable: 'Включить', autoDisable: 'Выключить',
  idleTitle: 'Когда сессия считается ждущей', min_: 'мин',
  levelsTitle: 'Цвет значка', green: 'зелёный', amberFrom: 'Жёлтый с', redFrom: 'Красный с',
  levelsHint: total => `Цвет показывает, какую долю всей памяти компьютера (${total}) занимают сессии Claude Code вместе.`,
  idleHint: m => `Сессия, которая ждёт вашего сообщения ${m}+ мин, попадает в цифру на значке трея и в строку меню: её можно выгрузить.`,
  idleEnv: 'Сейчас значение задано переменной RAMSLEEPER_IDLE_MINUTES и здесь не меняется.',
  menuTitle: 'Строка меню', menuHint: 'Установите одно из приложений и выполните команду в терминале.',
  installed: 'установлено', notInstalled: 'не установлено', copy: 'Копировать', copied: 'Скопировано',
  faq: [
    ['Потеряется ли переписка?', 'Нет. Выгрузка останавливает только процессы. Транскрипт сессии в ~/.claude/projects не трогается, и при следующем сообщении приложение запускает сессию из него с той же перепиской.'],
    ['Что будет с dev-сервером или базой, запущенными из сессии?', 'Они остановятся вместе с сессией: это её дочерние процессы. В окне подтверждения они выделены отдельно, чтобы это не стало сюрпризом.'],
    ['Можно ли выгрузить сессию со статусом «работает»?', 'Да, кнопкой «Прервать и выгрузить» после отдельного предупреждения. Ход, который идёт прямо сейчас, оборвётся; всё до него сохранится. Это выход для зависших сессий.'],
    ['Почему цифры не совпадают с Диспетчером задач?', 'Здесь считается частный рабочий набор всего дерева процессов сессии, как колонка «Память» на вкладке «Подробности». На вкладке «Процессы» Windows группирует процессы иначе. На macOS и Linux показывается RSS, где общая память учитывается несколько раз.'],
    ['Отправляет ли плагин что-то в сеть?', 'Нет. Всё читается с этого компьютера. Панель слушает только 127.0.0.1 и требует одноразовый токен из ссылки.'],
    ['Сколько стоит держать плагин установленным?', 'Фоновых процессов у плагина нет. В каждую сессию, где он включён, добавляется около 200 токенов описаний команд. Значок в трее — один процесс примерно на 60 МБ.'],
    ['Что будет, когда я снова открою сессию?', 'Она снова загрузится в память: приложение запустит её из транскрипта при первом сообщении, с той же перепиской. Память она, конечно, займёт заново.'],
    ['Как всё удалить?', 'Выключите запуск при входе здесь или в меню значка, выберите «Выход», затем выполните claude plugin uninstall ramsleeper@ramsleeper.'],
  ],
} : {
  tabSessions: 'Sessions', tabSetup: 'Setup', faqTitle: 'Questions',
  interruptBtn: 'Interrupt and unload', busyWarn: 'This session is working: the running turn will be cut off. The conversation up to it is kept.',
  nodeTitle: 'Node.js', nodeOk: v => `${v} is installed.`, nodeOld: v => `${v} is installed; version 18 or newer is needed.`,
  cmdTitle: 'Commands in Claude Code',
  cmdHint: 'Or just ask Claude, for example "which session uses the most memory?" or "unload the ones idle since this morning".',
  cmds: [['/ramsleeper:sessions', 'list sessions with their memory'], ['/ramsleeper:sessions unload 3', 'unload the session on row 3, after you confirm'],
    ['/ramsleeper:dashboard', 'this dashboard'], ['/ramsleeper:tray', 'tray or menu bar icon'], ['/ramsleeper:setup', 'this setup page']],
  trayTitle: 'Windows tray icon', trayOn: 'Running. The number is how many sessions are waiting for your message (threshold below); the color is how much memory all sessions hold.',
  trayOff: 'Not running. Clicking the icon opens the session list with Unload buttons.', trayStart: 'Start',
  autoTitle: 'Start at Windows sign-in', autoOn: 'On: the icon comes back by itself after a restart.', autoOff: 'Off.',
  autoEnable: 'Turn on', autoDisable: 'Turn off',
  idleTitle: 'When a session counts as idle', min_: 'min',
  levelsTitle: 'Icon color', green: 'green', amberFrom: 'Amber from', redFrom: 'Red from',
  levelsHint: total => `The color shows how much of this computer's total memory (${total}) all Claude Code sessions hold together.`,
  idleHint: m => `A session that has waited for your message for ${m}+ minutes is counted on the tray icon and in the menu bar as ready to unload.`,
  idleEnv: 'The RAMSLEEPER_IDLE_MINUTES environment variable sets this now, so it can’t be changed here.',
  menuTitle: 'Menu bar', menuHint: 'Install one of these apps, then run the command in a terminal.',
  installed: 'installed', notInstalled: 'not installed', copy: 'Copy', copied: 'Copied',
  faq: [
    ['Do I lose the conversation?', 'No. Unloading stops processes only. The session transcript in ~/.claude/projects is not touched, and on the next message the app starts the session from it with the same conversation.'],
    ['What happens to a dev server or database started from a session?', 'It stops with the session, because it is one of its child processes. The confirmation lists such processes separately so it is not a surprise.'],
    ['Can I unload a busy session?', 'Yes, with Interrupt and unload, after a separate warning. The turn that is running is cut off; everything before it is kept. It is the way out for a stuck session.'],
    ['Why don’t the numbers match Task Manager?', 'This counts the private working set of the session’s whole process tree, like the Memory column on the Details tab. The Processes tab groups processes differently. On macOS and Linux it shows RSS, which counts shared memory more than once.'],
    ['Does the plugin send anything over the network?', 'No. Everything is read on this computer. The dashboard listens on 127.0.0.1 only and needs the one-time token in its link.'],
    ['What does keeping the plugin installed cost?', 'The plugin has no background processes. Each session where it is enabled gets about 200 tokens of command descriptions. The tray icon is one process of about 60 MB.'],
    ['What happens when I open the session again?', 'It loads back into memory: on your first message the app starts it from its transcript, with the same conversation. It takes up memory again, of course.'],
    ['How do I remove everything?', 'Turn off start at sign-in here or in the icon’s menu, choose Exit, then run claude plugin uninstall ramsleeper@ramsleeper.'],
  ],
});
document.documentElement.lang = RU ? 'ru' : 'en';
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T[el.dataset.i18n]; });

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mb = b => b >= 1073741824 ? `${(b / 1073741824).toFixed(1)} ${RU ? 'ГБ' : 'GB'}` : `${Math.round(b / 1048576)} ${RU ? 'МБ' : 'MB'}`;
const ago = ms => {
  if (!ms) return '—';
  const s = (Date.now() - ms) / 1000;
  return s < 90 ? T.just : s < 5400 ? T.min(Math.round(s / 60)) : s < 129600 ? T.hr(Math.round(s / 3600)) : T.day(Math.round(s / 86400));
};
// The script marks children a user would not expect to lose (dev servers,
// databases, browsers); MCP servers and their shells are routine.
const isFlagged = c => c.notable;

let data = null, lastOk = 0, pending = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'X-Ramsleeper-Token': TOKEN, 'Content-Type': 'application/json' } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !('ok' in j)) throw new Error(j.error || r.statusText);
  return j;
}

async function refresh() {
  if (!$('view-setup').hidden) loadSetup();
  try {
    data = await api('/api/sessions');
    lastOk = Date.now();
    render();
    // A link ending in #unload-<pid> opens that session's confirmation once.
    const deep = location.hash.match(/^#unload-(\d+)$/);
    if (deep && !$('confirm').open) {
      history.replaceState(null, '', location.pathname + location.search);
      document.querySelector(`button[data-pid="${deep[1]}"]`)?.click();
    }
  } catch (e) {
    if (!data) $('list').innerHTML = `<div class="error">${esc(e.message)}</div>`;
    else $('updated').textContent = T.gone;
  }
}

function render() {
  const { sessions, app, memMetric } = data;
  const total = sessions.reduce((t, s) => t + s.memBytes, 0);
  const procs = sessions.reduce((t, s) => t + s.processCount, 0);
  $('stats').innerHTML = [
    [mb(total), `${T.total} · ${procs} ${T.procs.toLowerCase()}`],
    [sessions.length, T.sessions],
    ...(app ? [[mb(app.memBytes), T.app]] : []),
  ].map(([b, s]) => `<div class="stat"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('');
  $('metric').textContent = T.metric(memMetric);
  if (!sessions.length) { $('list').innerHTML = `<div class="empty">${T.none}</div>`; return; }
  const max = Math.max(...sessions.map(s => s.memBytes));
  $('list').innerHTML = `<table>
    <thead><tr><th>${T.session}</th><th>${T.ram}</th><th class="hide-sm">${T.procs}</th><th>${T.status}</th><th class="hide-sm">${T.last}</th><th></th></tr></thead>
    <tbody>${sessions.map(s => {
      const why = s.current ? T.whyCurrent : '';
      return `<tr>
        <td><div class="title">${esc(s.title)}${s.current ? `<span class="you">${T.you}</span>` : ''}</div><div class="cwd">${esc(s.cwd)}</div></td>
        <td class="num ram">${mb(s.memBytes)}<div class="bar"><i style="width:${Math.max(2, s.memBytes / max * 100)}%"></i></div></td>
        <td class="num hide-sm">${s.processCount}</td>
        <td><span class="pill ${s.status === 'busy' ? 'busy' : 'idle'}">${esc(T[s.status] || s.status)}</span></td>
        <td class="num hide-sm">${ago(s.lastActivityAt)}</td>
        <td><button data-pid="${s.pid}" ${why ? `disabled title="${esc(why)}"` : ''}>${s.status === 'busy' ? T.interruptBtn : T.unload}</button></td>
      </tr>`;
    }).join('')}</tbody></table>`;
  tick();
}

function tick() { if (lastOk) $('updated').textContent = T.updated(ago(lastOk)); }

$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-pid]');
  if (!b) return;
  const s = data.sessions.find(x => x.pid === Number(b.dataset.pid));
  if (!s) return;
  pending = s;
  const flagged = s.children.filter(isFlagged);
  const resume = s.entrypoint === 'claude-desktop' ? T.resumeDesktop : T.resumeCli(esc(`claude --resume ${s.sessionId}`));
  $('c-title').textContent = T.confirmTitle(s.title);
  $('c-body').innerHTML = `
    <p>${T.frees(mb(s.memBytes), s.processCount)}</p>
    <ul>
      <li>claude — ${mb(s.ownMemBytes)} (PID ${s.pid})</li>
      ${s.children.map(c => `<li class="${isFlagged(c) ? 'flag' : ''}">${esc(c.name)}${c.cmd ? ' · ' + esc(c.cmd) : ''} — ${mb(c.memBytes)}</li>`).join('')}
    </ul>
    ${flagged.length ? `<p class="flag">${T.flagged} ${flagged.map(c => esc(c.cmd || c.name)).join(', ')}</p>` : ''}
    <div class="note">${T.keep}<br>${resume}</div>`;
  if (s.status === 'busy') $('c-body').insertAdjacentHTML('afterbegin', `<p class="flag">${T.busyWarn}</p>`);
  $('c-ok').textContent = s.status === 'busy' ? T.interruptBtn : T.unload;
  $('c-ok').disabled = false;
  $('confirm').showModal();
});

$('c-cancel').onclick = () => $('confirm').close();
$('c-ok').onclick = async () => {
  const s = pending;
  $('c-ok').disabled = true;
  try {
    const r = await api('/api/unload', { method: 'POST', body: JSON.stringify({ pid: s.pid, sessionId: s.sessionId, force: s.status === 'busy' }) });
    toast(r.ok ? T.done(s.title, mb(r.freedBytes)) : T.failed(r.error));
  } catch (e) { toast(T.failed(e.message)); }
  $('confirm').close();
  refresh();
};

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.style.display = 'none'; }, 7000);
}

// ---------------------------------------------------------------- setup view

let setup = null;

async function loadSetup() {
  try { setup = await api('/api/setup'); renderSetup(); }
  catch (e) { $('steps').innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

const step = (ok, title, body, buttons = '') =>
  `<div class="step"><span class="mark ${ok === true ? 'ok' : ok === false ? 'todo' : ''}">${ok === true ? '✓' : ok === false ? '!' : '·'}</span>
    <div><b>${title}</b>${body}</div><div class="btns">${buttons}</div></div>`;
const cmdLine = text => `<div class="cmd"><span>${esc(text)}</span><button data-copy="${esc(text)}">${T.copy}</button></div>`;

function renderSetup() {
  const s = setup;
  let html = step(s.node.ok, T.nodeTitle, `<p>${esc((s.node.ok ? T.nodeOk : T.nodeOld)(s.node.version))}</p>`);
  html += step(null, T.cmdTitle,
    `<ul class="cmds">${T.cmds.map(([c, d]) => `<li><code>${esc(c)}</code> — ${esc(d)}</li>`).join('')}</ul><p>${esc(T.cmdHint)}</p>`);
  if (s.tray) {
    html += step(s.tray.running, T.trayTitle, `<p>${s.tray.running ? T.trayOn : T.trayOff}</p>`,
      s.tray.running ? '' : `<button data-act="tray">${T.trayStart}</button>`);
    html += step(s.tray.autostart, T.autoTitle, `<p>${s.tray.autostart ? T.autoOn : T.autoOff}</p>`,
      `<button data-act="${s.tray.autostart ? 'autostart-off' : 'autostart-on'}">${s.tray.autostart ? T.autoDisable : T.autoEnable}</button>`);
  }
  if (s.idle) {
    const pick = s.idle.choices.map(m => `<button data-act="idle-${m}" class="${m === s.idle.minutes ? 'on' : ''}" aria-pressed="${m === s.idle.minutes}" ${s.idle.fromEnv ? 'disabled' : ''}>${m} ${T.min_}</button>`).join('');
    html += step(null, T.idleTitle, `<p>${esc(T.idleHint(s.idle.minutes))}</p>${s.idle.fromEnv ? `<p>${esc(T.idleEnv)}</p>` : ''}<div class="seg">${pick}</div>`);
  }
  if (s.levels) {
    const { warnPct: w, highPct: h, warnChoices, highChoices, systemMemBytes: ram } = s.levels;
    const gb = p => `${(ram * p / 100 / 1073741824).toFixed(1)} ${RU ? 'ГБ' : 'GB'}`;
    // A new amber value keeps red if it is still above it, otherwise takes the next red option.
    const warnBtns = warnChoices.map(p => {
      const hh = h > p ? h : highChoices.find(x => x > p);
      return `<button data-act="levels-${p}-${hh}" class="${p === w ? 'on' : ''}" aria-pressed="${p === w}">${p}%</button>`;
    }).join('');
    const highBtns = highChoices.map(p =>
      `<button data-act="levels-${w}-${p}" class="${p === h ? 'on' : ''}" aria-pressed="${p === h}" ${p <= w ? 'disabled' : ''}>${p}%</button>`).join('');
    html += step(null, T.levelsTitle, `<p>${esc(T.levelsHint(gb(100)))}</p>
      <div class="bands" aria-hidden="true">
        <span class="b-ok" style="flex:${w}">${T.green} &lt; ${w}%</span>
        <span class="b-warn" style="flex:${h - w}">${w}–${h}%</span>
        <span class="b-high" style="flex:${Math.max(100 - h, 15)}">${h}%+</span>
      </div>
      <div class="lvl-row"><span>${T.amberFrom}</span><div class="seg">${warnBtns}</div><span class="gb">≈ ${gb(w)}</span></div>
      <div class="lvl-row"><span>${T.redFrom}</span><div class="seg">${highBtns}</div><span class="gb">≈ ${gb(h)}</span></div>`);
  }
  if (s.menubar && s.menubar.length) {
    const any = s.menubar.some(a => a.installed);
    html += step(any, T.menuTitle, `<p>${T.menuHint}</p>` + s.menubar.map(a =>
      `<p style="margin-top:10px"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a> — ${a.installed ? T.installed : T.notInstalled}</p>${cmdLine(a.command)}`).join(''));
  }
  $('steps').innerHTML = html;
  $('faq').innerHTML = T.faq.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('');
}

$('steps').addEventListener('click', async e => {
  const copy = e.target.closest('button[data-copy]');
  if (copy) {
    try { await navigator.clipboard.writeText(copy.dataset.copy); copy.textContent = T.copied; } catch { /* select manually */ }
    return;
  }
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  b.disabled = true;
  try { await api(`/api/setup/${b.dataset.act}`, { method: 'POST', body: '{}' }); }
  catch (err) { toast(T.failed(err.message)); }
  // The tray takes a moment to write its PID file.
  setTimeout(loadSetup, b.dataset.act === 'tray' ? 2500 : 300);
});

function route() {
  const isSetup = location.hash === '#setup';
  $('view-setup').hidden = !isSetup;
  $('view-sessions').hidden = isSetup;
  $('tab-setup').toggleAttribute('aria-current', isSetup);
  $('tab-sessions').toggleAttribute('aria-current', !isSetup);
  if (isSetup) { $('tab-setup').setAttribute('aria-current', 'page'); loadSetup(); }
  else $('tab-sessions').setAttribute('aria-current', 'page');
}
window.addEventListener('hashchange', route);
route();

refresh();
setInterval(refresh, 10000);
setInterval(tick, 5000);
</script>
</body>
</html>
